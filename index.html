<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A0807">
<title>NOY GAVRIELOV Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Rubik:ital,wght@0,500;0,700;0,900;1,900&display=swap">
<style>
/* Layout: "the forge" — a single dark world of black iron lit from below by furnace heat; giant slanted Anton type, ember gradients only where effort happens (the target to beat, a done set, a PR, the rest ring). */
:root{
  --iron:#0A0807; --iron-2:#14100D; --iron-3:#1E1814; --ash:#2C241F; --bone:#F5EEE6; --dim:#A49A8F; --ghost:#6E645B;
  --e1:#FFC23D; --e2:#FF6A1A; --e3:#E3173E; --heat:linear-gradient(100deg,var(--e1) 0%,var(--e2) 45%,var(--e3) 100%);
  --good:#FFC23D; --spot:#1DB954;
  --p1:#E3173E; --p2:#3A6BFF; --p3:#FFC23D; --p4:#2BC46B;
  --en:"Anton","Rubik",Impact,sans-serif; --he:"Rubik",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--iron);color:var(--bone);font-family:var(--he);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--iron)}
.furnace{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(90% 45% at 50% 108%,rgba(255,106,26,.38) 0%,rgba(227,23,62,.14) 40%,transparent 70%),radial-gradient(60% 30% at 85% -5%,rgba(255,194,61,.08),transparent 70%)}
#sparks{position:fixed;inset:0;z-index:1;pointer-events:none;width:100%;height:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--e1);outline-offset:2px}
[hidden]{display:none!important}
.wrap{position:relative;z-index:2;max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 240px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;padding-block:14px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(var(--iron) 70%,transparent)}
.logo{font-family:var(--en);font-size:24px;letter-spacing:.06em;direction:ltr;line-height:1;background:linear-gradient(180deg,#FFFFFF 0%,#BDB3A8 55%,#6E645B 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font-family:var(--he);font-weight:700;font-size:11px;letter-spacing:.02em;color:var(--dim);-webkit-text-fill-color:var(--dim);text-align:right;margin-top:4px}
.hdr-r{display:flex;gap:8px;align-items:center}
.streak{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:99px;background:var(--iron-3);border:1px solid var(--ash);font-family:var(--en);font-size:20px;letter-spacing:.04em}
.streak svg{width:18px;height:18px}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:var(--iron-3);border:1px solid var(--ash)}
.kicker{font-family:var(--en);font-size:15px;letter-spacing:.18em;color:var(--dim);direction:ltr;text-align:right;text-transform:uppercase}
.mega{font-family:var(--en);text-transform:uppercase;direction:ltr;text-align:right;line-height:.86;margin:0;transform:skewX(-8deg);transform-origin:right bottom;letter-spacing:.005em}
.mega .hot{background:var(--heat);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,106,26,.45))}
.mega .out{color:transparent;-webkit-text-stroke:1.5px var(--bone)}
h1.mega{font-size:clamp(64px,19vw,104px)}
h2{font-family:var(--he);font-weight:900;font-size:20px;margin:0;line-height:1.2}
.sub{color:var(--dim);margin:6px 0 0}
.stack{display:flex;flex-direction:column;gap:18px}
/* target-to-beat */
.boss{position:relative;border-radius:22px;padding:2px;background:var(--heat);box-shadow:0 0 0 1px rgba(255,106,26,.2),0 20px 60px -20px rgba(255,106,26,.55)}
.boss-in{border-radius:20px;background:linear-gradient(160deg,#1C130E 0%,#0E0A08 70%);padding:20px 18px 18px;display:flex;flex-direction:column;gap:12px;overflow:hidden;position:relative}
.boss-in::after{content:"";position:absolute;inset:auto -30% -60% -30%;height:120%;background:radial-gradient(closest-side,rgba(255,106,26,.25),transparent);pointer-events:none}
.boss .label{font-family:var(--en);font-size:16px;letter-spacing:.2em;color:var(--e1);direction:ltr;text-align:right}
.boss .num{font-family:var(--en);font-size:clamp(70px,22vw,112px);line-height:.85;direction:ltr;text-align:right;transform:skewX(-8deg);transform-origin:right bottom}
.boss .num small{font-size:.38em;color:var(--dim);letter-spacing:.06em}
.boss .what{font-weight:700;font-size:16px}
.fire{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:10px;height:64px;border-radius:16px;background:var(--heat);color:#140A04;font-family:var(--en);font-size:28px;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 10px 30px -8px rgba(227,23,62,.6)}
@media (prefers-reduced-motion:no-preference){.fire{animation:breathe 2.4s ease-in-out infinite}@keyframes breathe{50%{box-shadow:0 10px 44px -4px rgba(255,106,26,.85)}}}
.fire:active{transform:scale(.97)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--iron-2);border:1px solid var(--ash);border-radius:16px;padding:14px 12px}
.stat b{display:block;font-family:var(--en);font-size:40px;line-height:1;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.stat span{font-size:12px;color:var(--dim)}
.stat.hot b{background:var(--heat);-webkit-background-clip:text;background-clip:text;color:transparent}
.panel{background:var(--iron-2);border:1px solid var(--ash);border-radius:20px;padding:18px}
.rules{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.rules li{display:flex;gap:10px}
.rules li::before{content:"";flex:none;width:8px;height:8px;margin-top:8px;background:var(--e2);transform:rotate(45deg)}
.src{font-size:12px;color:var(--ghost);margin-top:10px}
.note{border-radius:14px;padding:12px 14px;font-size:14px;background:rgba(255,106,26,.1);border:1px solid rgba(255,106,26,.35)}
.warn{border-radius:14px;padding:12px 14px;font-size:14px;color:var(--dim);border:1px dashed var(--ash)}
/* poster */
.poster{position:relative;overflow:hidden;border-radius:22px;background:#050404;min-height:340px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);direction:ltr;isolation:isolate;border:1px solid var(--ash)}
.poster::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(70% 60% at 25% 100%,rgba(255,106,26,.45),transparent 70%),radial-gradient(120% 80% at 20% 10%,#2c2622 0%,#0d0b0a 60%)}
.poster::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.25;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.poster .fig{align-self:end;width:100%;height:auto;display:block;filter:drop-shadow(0 0 14px rgba(255,106,26,.35))}
.poster .txt{padding:22px 18px 18px 4px;display:flex;flex-direction:column;gap:10px;z-index:2;min-width:0}
.poster .hd{font-family:var(--en);font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:.95}
.poster .hd span{background:var(--heat);-webkit-background-clip:text;background-clip:text;color:transparent}
.poster ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;counter-reset:r}
.poster li{font-family:var(--en);font-size:17px;letter-spacing:.05em;text-transform:uppercase;line-height:1.05;counter-increment:r;display:flex;gap:8px;color:#EDE6DE}
.poster li::before{content:counter(r);color:var(--e2);min-width:14px}
.poster .q{font-family:var(--he);font-weight:900;font-style:italic;font-size:15px;line-height:1.25;margin:4px 0 0;color:var(--e1)}
.poster button{align-self:flex-start;font-family:var(--en);font-size:13px;letter-spacing:.14em;color:var(--bone);border:1px solid rgba(245,238,230,.35);border-radius:99px;padding:5px 12px}
/* playlists */
.prow{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;margin-inline:-16px;padding-inline:16px}
.pcard{flex:none;width:140px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;text-align:start}
.pcard .art{width:140px;height:140px;border-radius:16px;background:linear-gradient(140deg,var(--ash),var(--iron-3));display:grid;place-items:center;overflow:hidden;position:relative;border:1px solid var(--ash)}
.pcard .art img{width:100%;height:100%;object-fit:cover}
.pcard .art .play{position:absolute;bottom:8px;left:8px;width:40px;height:40px;border-radius:50%;background:var(--spot);color:#0B0B0B;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.pcard .art .glyph{font-family:var(--en);font-size:56px;color:var(--ghost)}
.pcard b{font-weight:700;font-size:14px;line-height:1.2}
.pcard span{font-size:12px;color:var(--dim)}
.connect-card{display:flex;align-items:center;gap:14px}
.connect-card .btn{flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 22px;border-radius:14px;font-family:var(--en);font-size:20px;letter-spacing:.1em;text-transform:uppercase}
.btn.heat{background:var(--heat);color:#140A04}
.btn.iron{background:var(--iron-3);border:1px solid var(--ash)}
.btn.spot{background:var(--spot);color:#0B0B0B}
.btn.block{width:100%}
/* exercises */
.ex{position:relative;background:var(--iron-2);border:1px solid var(--ash);border-radius:22px;padding:16px 14px 6px;overflow:hidden;transition:border-color .3s,box-shadow .3s}
.ex.cleared{border-color:rgba(255,106,26,.7);box-shadow:0 0 0 1px rgba(255,106,26,.25),0 18px 50px -24px rgba(255,106,26,.7)}
.ex-bg{position:absolute;top:-16px;left:6px;font-family:var(--en);font-size:120px;line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(245,238,230,.08);pointer-events:none;direction:ltr}
.ex.cleared .ex-bg{-webkit-text-stroke-color:rgba(255,106,26,.35)}
.ex-head{position:relative;display:flex;gap:12px;align-items:flex-start}
.ex-title{flex:1;min-width:0}
.ex-title .kicker{text-align:right;direction:rtl;font-family:var(--he);font-weight:700;letter-spacing:.04em;font-size:13px;color:var(--e2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12px;font-weight:500;background:var(--iron-3);border:1px solid var(--ash);border-radius:99px;padding:2px 10px;color:var(--dim)}
.chip.beat{color:var(--e1);border-color:rgba(255,194,61,.35)}
.swap{font-family:var(--en);font-size:14px;letter-spacing:.12em;color:var(--dim);border:1px solid var(--ash);border-radius:99px;padding:3px 12px;white-space:nowrap}
.heatbar{position:relative;height:5px;border-radius:5px;background:var(--iron-3);margin:14px 0 4px;overflow:hidden}
.heatbar i{position:absolute;inset:0 0 0 auto;background:var(--heat);border-radius:5px;transition:width .4s}
.set-labels,.set{position:relative;display:grid;grid-template-columns:34px minmax(0,1fr) 74px 64px 48px;gap:8px;align-items:center}
.set-labels{margin-top:10px;padding-bottom:4px;font-size:11px;color:var(--ghost);font-weight:500}
.set{padding:8px 0;border-top:1px solid var(--ash)}
.badge{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--en);font-size:16px;color:#fff}
.b1{background:var(--p1)}.b2{background:var(--p2)}.b3{background:var(--p3);color:#1B1B1B}.b4{background:var(--p4)}
.ghost{font-size:13px;color:var(--ghost);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghost .up{color:var(--e1);font-weight:900}
.set input{width:100%;height:46px;border-radius:12px;border:1px solid var(--ash);background:var(--iron);text-align:center;font-family:var(--en);font-size:24px;font-variant-numeric:tabular-nums;color:var(--bone)}
.set input:focus{border-color:var(--e2);outline:none;box-shadow:0 0 0 3px rgba(255,106,26,.25)}
.set input::placeholder{color:var(--ghost)}
.check{width:46px;height:46px;border-radius:14px;border:2px solid var(--ash);display:grid;place-items:center;color:var(--dim);background:var(--iron)}
.set.done .check{background:var(--heat);border-color:transparent;color:#140A04}
.set.done input{border-color:rgba(255,106,26,.4)}
.set.pr::after{content:"PR";position:absolute;top:-6px;right:-4px;font-family:var(--en);font-size:12px;letter-spacing:.1em;background:var(--e1);color:#140A04;border-radius:6px;padding:1px 6px;transform:rotate(-8deg)}
@media (prefers-reduced-motion:no-preference){.set.pr::after{animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}@keyframes stamp{from{transform:scale(2.4) rotate(-20deg);opacity:0}}}
.add-set{font-family:var(--en);font-size:14px;letter-spacing:.12em;color:var(--ghost);padding:12px 0;width:100%;text-align:start;border-top:1px solid var(--ash)}
/* finish summary */
.forged{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding-block:10px}
.forged .mega{text-align:center;transform-origin:center}
.big3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
/* progress */
.chiprow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chiprow button{flex:none;height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--ash);background:var(--iron-2);font-size:13px;font-weight:500;white-space:nowrap}
.chiprow button[aria-pressed="true"]{background:var(--heat);color:#140A04;border-color:transparent;font-weight:700}
.chart svg{width:100%;height:auto;display:block}
.hist div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--ash);font-variant-numeric:tabular-nums}
.hist span:last-child{color:var(--dim);direction:ltr}
.pr{font-family:var(--en);font-size:12px;letter-spacing:.1em;background:var(--e1);color:#140A04;padding:1px 7px;border-radius:5px}
/* settings */
.field{width:100%;height:50px;border-radius:12px;border:1px solid var(--ash);background:var(--iron);padding:0 12px;direction:ltr}
.copyrow{display:flex;gap:8px}
.copyrow code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;background:var(--iron);border:1px solid var(--ash);border-radius:12px;padding:14px 12px;font-size:13px;direction:ltr}
ol.steps{margin:8px 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
/* dock */
.dock{position:fixed;inset:auto 0 0;z-index:8;background:linear-gradient(transparent,rgba(10,8,7,.92) 22%,var(--iron) 40%);padding:18px max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.dock-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.timer{display:flex;align-items:center;gap:14px;background:var(--iron-2);border:1px solid rgba(255,106,26,.5);border-radius:20px;padding:10px 14px;box-shadow:0 0 40px -12px rgba(255,106,26,.6)}
.ring{position:relative;width:68px;height:68px;flex:none}
.ring svg{width:68px;height:68px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--en);font-size:21px;font-variant-numeric:tabular-nums}
.timer .lbl{flex:1;min-width:0;font-size:13px;color:var(--dim)}
.timer .lbl strong{display:block;font-family:var(--en);font-size:20px;letter-spacing:.1em;color:var(--bone)}
.timer button{height:38px;padding:0 10px;border-radius:10px;background:var(--iron-3);border:1px solid var(--ash);font-family:var(--en);font-size:15px;letter-spacing:.06em}
.player{display:flex;align-items:center;gap:10px;background:var(--iron-2);border:1px solid var(--ash);border-radius:18px;padding:8px 10px}
.player img,.player .ph{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--iron-3);flex:none}
.player .ph{display:grid;place-items:center;color:var(--spot)}
.player .meta{flex:1;min-width:0}
.player .meta b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .meta span{display:block;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .ctl{display:flex;gap:2px;direction:ltr;align-items:center}
.player .ctl button{width:40px;height:40px;display:grid;place-items:center;color:var(--bone)}
.player .ctl .pp{width:44px;height:44px;background:var(--bone);color:var(--iron);border-radius:50%}
.player .connect{font-family:var(--en);font-size:16px;letter-spacing:.1em;color:var(--spot)}
nav.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--iron-2);border:1px solid var(--ash);border-radius:20px;padding:5px;margin-bottom:8px}
nav.tabs button{height:50px;border-radius:15px;font-family:var(--en);font-size:17px;letter-spacing:.14em;color:var(--ghost);display:flex;align-items:center;justify-content:center;gap:6px}
nav.tabs button svg{width:18px;height:18px}
nav.tabs button[aria-current="page"]{background:var(--heat);color:#140A04}
@media (max-width:380px){.set-labels,.set{grid-template-columns:30px minmax(0,1fr) 64px 56px 44px;gap:6px}.poster li{font-size:15px}.pcard,.pcard .art{width:120px}.pcard .art{height:120px}}
</style>
</head>
<body>
<div class="furnace" aria-hidden="true"></div>
<canvas id="sparks" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="top">
    <div class="logo">NOY GAVRIELOV<small>נוי גבריאלוב</small></div>
    <div class="hdr-r">
      <div class="streak" id="streak" title="אימונים ב־30 הימים האחרונים"><svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="fl" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#E3173E"/><stop offset=".5" stop-color="#FF6A1A"/><stop offset="1" stop-color="#FFC23D"/></linearGradient></defs><path fill="url(#fl)" d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-4-1-6 1-9z"/></svg><span id="streakN">0</span></div>
      <button class="iconbtn" type="button" id="openSettings" aria-label="הגדרות"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
    </div>
  </header>
  <main id="app" class="stack"></main>
</div>
<div class="dock"><div class="dock-in">
  <div class="timer" id="timer" hidden>
    <div class="ring"><svg viewBox="0 0 68 68"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC23D"/><stop offset=".5" stop-color="#FF6A1A"/><stop offset="1" stop-color="#E3173E"/></linearGradient></defs><circle cx="34" cy="34" r="29" fill="none" stroke="#2C241F" stroke-width="6"/><circle id="tArc" cx="34" cy="34" r="29" fill="none" stroke="url(#rg)" stroke-width="6" stroke-linecap="round" stroke-dasharray="182.2" stroke-dashoffset="0"/></svg><b id="tNum">1:30</b></div>
    <div class="lbl"><strong id="tHead">REST</strong><span id="tLbl">מנוחה</span></div>
    <button id="tMinus" type="button">−15</button><button id="tPlus" type="button">+15</button><button id="tSkip" type="button">GO</button>
  </div>
  <div class="player" id="player"></div>
  <nav class="tabs">
    <button type="button" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>HOME</button>
    <button type="button" data-tab="workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2 12h20M5 8v8M8 6v12M16 6v12M19 8v8"/></svg>TRAIN</button>
    <button type="button" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 20h18M5 16l5-5 4 3 6-7"/></svg>GAINS</button>
  </nav>
</div></div>

<script>
/* ================= plan (from the coach's page) ================= */
const QUOTES=[{"t": "I hated every minute of training, but I said, 'Don't quit. Suffer now and live the rest of your life as a champion.'", "a": "Muhammad Ali"}, {"t": "If you don't find the time, if you don't do the work, you don't get the results.", "a": "Arnold Schwarzenegger"}, {"t": "The real workout starts when you want to stop.", "a": "Ronnie Coleman"}, {"t": "Take care of your body. It's the only place you have to live.", "a": "Jim Rohn"}, {"t": "I've failed over and over again in my life and that is why I succeed.", "a": "Michael Jordan"}, {"t": "Most people fail, not because of lack of desire, but because of lack of commitment.", "a": "Vince Lombardi"}, {"t": "You miss one hundred percent of the shots you don't take.", "a": "Wayne Gretzky"}, {"t": "If something stands between you and your success, move it. Never be denied.", "a": "Dwayne \"The Rock\" Johnson"}, {"t": "Just believe in yourself. Even if you don't, just pretend that you do and at some point, you will.", "a": "Venus Williams"}, {"t": "It's hard to beat a person who never gives up.", "a": "Babe Ruth"}, {"t": "Success is usually the culmination of controlling failure.", "a": "Sylvester Stallone"}, {"t": "I don't count my sit-ups. I only start counting when it starts hurting because they're the only ones that count.", "a": "Muhammad Ali"}, {"t": "What hurts today makes you stronger tomorrow.", "a": "Jay Cutler"}, {"t": "You must expect things of yourself before you can do them.", "a": "Michael Jordan"}, {"t": "Motivation is what gets you started. Habit is what keeps you going.", "a": "Jim Ryun"}, {"t": "A champion is someone who gets up when they can't.", "a": "Jack Dempsey"}, {"t": "The only bad workout is the one that didn't happen.", "a": "Unknown"}, {"t": "Don't be afraid of failure. This is the way to succeed.", "a": "LeBron James"}, {"t": "You did not wake up today to be mediocre.", "a": "Robin Arzon"}, {"t": "If it doesn't challenge you, it doesn't change you.", "a": "Fred DeVito"}, {"t": "You can either suffer the pain of discipline or the pain of regret.", "a": "Jim Rohn"}, {"t": "We can push ourselves further. We always have more to give.", "a": "Simone Biles"}, {"t": "If you want to be the best, you have to do things other people aren't willing to do.", "a": "Michael Phelps"}, {"t": "Every champion was once a contender who refused to give up.", "a": "Rocky Balboa"}, {"t": "Keep working even when no one is watching.", "a": "Alex Morgan"}, {"t": "Don't dream of winning. Train for it!", "a": "Mo Farah"}, {"t": "Discipline is the bridge between goals and accomplishment.", "a": "Jim Rohn"}, {"t": "Great things come from hard work and perseverance. No excuses.", "a": "Kobe Bryant"}, {"t": "Be humble. Be hungry. And always be the hardest worker in the room.", "a": "Dwayne \"The Rock\" Johnson"}, {"t": "Get comfortable with being uncomfortable!", "a": "Jillian Michaels"}, {"t": "It's supposed to be hard. If it wasn't hard, everyone would do it. The hard is what makes it great.", "a": "Tom Hanks"}, {"t": "The successful warrior is the average man, with laser-like focus.", "a": "Bruce Lee"}, {"t": "Making excuses burns zero calories per hour.", "a": "Unknown"}];
const S3=(r,rest)=>[{r,rest},{r,rest},{r,rest}];
const PLAN=[
 {g:'חזה',main:{key:'chest_db',name:'לחיצת חזה כנגד משקולות בשכיבה',sets:S3(8,90)},alt:{key:'chest_bb',name:'לחיצת חזה כנגד מוט בשכיבה',sets:S3(6,120)}},
 {g:'רחב גבי',main:{key:'lat_pd',name:'משיכה כנגד פולי עליון באחיזה צרה',sets:S3(6,120)},alt:{key:'pullup',name:'מתח, בתוספת משקל אם נדרש',sets:S3(0,50)}},
 {g:'רגליים',main:{key:'squat',name:'סקוואט כנגד מוט',sets:[{r:6,rest:120},{r:4,rest:180}]}},
 {g:'כתף אמצעית',main:{key:'lat_raise_db',name:'הרחקת כתפיים לצדדים כנגד משקולות יד',sets:S3(15,50)},alt:{key:'lat_raise_cable',name:'הרחקת כתף כנגד פולי תחתון',sets:S3(15,50)}},
 {g:'יד קדמית',main:{key:'curl_bb',name:'כפיפת מרפק עם מוט אולימפי',sets:S3(8,90)},alt:{key:'curl_db',name:'כפיפת מרפק עם משקולות יד',sets:S3(8,90)}},
 {g:'יד אחורית',main:{key:'tri_oh',name:'פשיטת מרפק כנגד משקולת מאחורי הראש',sets:S3(8,90)},alt:{key:'tri_cable',name:'פשיטת מרפק כנגד פולי תחתון',sets:S3(8,90)}},
 {g:'ישר בטני',main:{key:'abs',name:'כפיפות בטן על בוסו או על כרית',sets:S3(0,50)}}
];
const ALL={};PLAN.forEach(p=>[p.main,p.alt].filter(Boolean).forEach(e=>ALL[e.key]={...e,g:p.g}));

/* ================= storage (this device) ================= */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function nextQuote(){let last=LS.get('ng-q',-1),i=Math.floor(Math.random()*QUOTES.length);if(QUOTES.length>1&&i===last)i=(i+1)%QUOTES.length;LS.set('ng-q',i);return i}
const st={tab:'today',settings:false,summary:null,sessions:LS.get('ng-sessions',[]),alt:LS.get('ng-alt',{}),draft:LS.get('ng-draft',null),prog:'chest_db',q:nextQuote(),msg:''};
const persist=()=>{LS.set('ng-sessions',st.sessions);LS.set('ng-alt',st.alt);st.draft?LS.set('ng-draft',st.draft):LS.del('ng-draft')};
const sortS=()=>st.sessions.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.savedAt||0)-(b.savedAt||0));

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtD=d=>{const [,m,dd]=d.split('-');return `${+dd}.${+m}`};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const repTxt=r=>r===0?'מקס׳':r;
const restTxt=s=>s>=60?(s%60?`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} דק׳`:`${s/60} דק׳`):`${s} שנ׳`;
function lastFor(k){for(let i=st.sessions.length-1;i>=0;i--){const s=st.sessions[i];if(s.ex&&s.ex[k]&&s.ex[k].length)return s}return null}
const better=(a,b)=>!!(a&&b&&a.w!=null&&(a.w>b.w||(a.w===b.w&&(a.r||0)>(b.r||0))));
const chosen=p=>st.alt[p.g]&&p.alt?p.alt:p.main;
function bestEver(k){let m=null;st.sessions.forEach(s=>(s.ex&&s.ex[k]||[]).forEach(x=>{if(x.w!=null&&(!m||x.w>m.w||(x.w===m.w&&(x.r||0)>(m.r||0))))m=x}));return m}
function draftSets(e){if(!st.draft)st.draft={date:today(),sets:{}};const d=st.draft.sets;if(!d[e.key])d[e.key]=e.sets.map(()=>({w:'',r:'',done:false}));return d[e.key]}
const daysSince=d=>Math.floor((new Date(today())-new Date(d))/864e5);

/* ================= views ================= */
function vToday(){
  const n=st.sessions.length,last=st.sessions[n-1];
  const month=st.sessions.filter(s=>daysSince(s.date)<30).length;
  let prs=0;const best={};st.sessions.forEach(s=>Object.entries(s.ex||{}).forEach(([k,a])=>a.forEach(x=>{if(x.w!=null&&(best[k]==null||x.w>best[k])){if(best[k]!=null)prs++;best[k]=x.w}})));
  const e0=chosen(PLAN[0]),prev=lastFor(e0.key),top=prev?prev.ex[e0.key][0]:null;
  const ds=last?daysSince(last.date):null;
  const head=ds==null?['Start','the','fire']:ds<=1?['Back','for','more']:ds<=3?['Time','to','work']:['The iron','is','waiting'];
  return `
  <div><div class="kicker">${last?(ds===0?'Trained today':ds+' day'+(ds===1?'':'s')+' since last session'):'Day one'}</div>
   <h1 class="mega">${head[0]}<br><span class="out">${head[1]}</span> <span class="hot">${head[2]}</span></h1></div>
  ${n===0?`<div class="warn">אין עדיין אימונים במכשיר הזה. אם יש לך קובץ היסטוריה, ייבא אותו בהגדרות.</div>`:''}
  <section class="boss">
    <div class="boss-in">
      <div class="label">${st.draft?'SESSION IN PROGRESS':'TODAY YOU BEAT'}</div>
      ${top?`<div class="num">${top.w}<small> KG</small> × ${top.r??'—'}</div><div class="what">${esc(e0.name)} · הסט הראשון מ־${fmtD(prev.date)}</div>`
           :`<div class="num">FULL<small> BODY</small></div><div class="what">7 תרגילים. כל מה שתרים היום יהיה היעד של הפעם הבאה.</div>`}
      <button class="fire" type="button" data-go="workout">${st.draft?'Back in':'Beat it'} <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="transform:scaleX(-1)"><path d="M13 5l7 7-7 7v-4H4V9h9z"/></svg></button>
    </div>
  </section>
  <div class="stats">
    <div class="stat hot"><b>${month}</b><span>אימונים ב־30 יום</span></div>
    <div class="stat"><b>${prs}</b><span>שיאים שנשברו</span></div>
    <div class="stat"><b>${n}</b><span>אימונים בסך הכול</span></div>
  </div>
  <section class="poster" aria-label="Motivation">
    <svg class="fig" viewBox="0 0 220 340" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8e1d9"/><stop offset=".6" stop-color="#6b625a"/><stop offset="1" stop-color="#FF6A1A"/></linearGradient></defs>
      <g fill="url(#lg)"><rect x="6" y="44" width="208" height="7" rx="3"/><rect x="10" y="22" width="16" height="52" rx="3"/><rect x="28" y="30" width="10" height="36" rx="2"/><rect x="182" y="30" width="10" height="36" rx="2"/><rect x="194" y="22" width="16" height="52" rx="3"/>
      <circle cx="110" cy="104" r="19"/><path d="M100 120h20l2 12h-24z"/><path d="M56 136c10-8 34-12 54-12s44 4 54 12l-8 40c-4 22-10 44-18 62H82c-8-18-14-40-18-62z"/>
      <path d="M62 140c-10-18-14-48-12-88l14 0c0 30 4 56 14 76z"/><path d="M158 140c10-18 14-48 12-88l-14 0c0 30-4 56-14 76z"/>
      <path d="M82 236h56l4 22-6 82h-20l-6-70-6 70H84l-6-82z"/></g></svg>
    <div class="txt">
      <div class="hd">Noy's 6 rules<br><span>for the iron</span></div>
      <ol><li>Show up, even on bad days</li><li>Heaviest set goes first</li><li>Last rep is all you've got</li><li>Beat the gray numbers</li><li>Rest, breathe, go again</li><li>Never skip leg day</li></ol>
      <p class="q" dir="ltr">“${esc(QUOTES[st.q%QUOTES.length].t)}”<span style="display:block;font-style:normal;font-weight:700;font-size:12px;color:var(--dim);margin-top:4px">— ${esc(QUOTES[st.q%QUOTES.length].a)}</span></p>
      <button type="button" data-act="quote">New quote</button>
    </div>
  </section>
  ${vPlaylists()}
  <section class="panel">
    <div class="kicker">The plan</div><h2>דגשים מהתוכנית</h2>
    <ul class="rules"><li>2 עד 3 אימונים בשבוע, לא בימים רצופים.</li><li>לא משנים את סדר התרגילים.</li><li>שני האימונים הראשונים הם הסתגלות: בתרגיל של 3 סטים עושים 2, ובתרגיל של 2 סטים עושים סט אחד.</li><li>כל סט עבודה עד כשל בטכניקה נכונה. סטי חימום לא לכשל.</li><li>פירמידה הפוכה: הסט הראשון הוא הכבד ביותר.</li></ul>
    <div class="src">מתוך תוכנית האימונים של דור אקשטיין</div>
  </section>`;
}

function vWorkout(){
  if(st.summary)return vSummary();
  const adapt=st.sessions.length<2;
  return `
  <div><div class="kicker">${fmtD(today())} · Full body</div><h1 class="mega">Go <span class="hot">heavy</span></h1><p class="sub">באפור: מה שהרמת בפעם הקודמת. ✓ בלי להקליד שומר אותם מספרים, ומספר גבוה יותר נדלק.</p></div>
  ${adapt?`<div class="note">אימון הסתגלות: בתרגיל של 3 סטים עושים 2, ובתרגיל של 2 סטים עושים סט אחד.</div>`:''}
  ${PLAN.map((p,i)=>{const e=chosen(p),prev=lastFor(e.key),ps=prev?prev.ex[e.key]:[],sets=draftSets(e),best=bestEver(e.key);
   const done=sets.filter(s=>s.done).length,cleared=done>=e.sets.length;
   const reps=[...new Set(e.sets.map(s=>repTxt(s.r)))].join(', '),rests=[...new Set(e.sets.map(s=>restTxt(s.rest)))].join(', ');
   return `<section class="ex${cleared?' cleared':''}" data-key="${e.key}"><div class="ex-bg">${String(i+1).padStart(2,'0')}</div>
    <div class="ex-head"><div class="ex-title"><div class="kicker">${esc(p.g)}</div><h2>${esc(e.name)}</h2>
      <div class="chips"><span class="chip">${e.sets.length} × ${reps}</span><span class="chip">מנוחה ${rests}</span>${best?`<span class="chip beat">שיא: ${best.w}×${best.r??'—'}</span>`:''}</div></div>
      ${p.alt?`<button class="swap" type="button" data-act="swap" data-g="${esc(p.g)}">${e===p.alt?'MAIN':'SWAP'}</button>`:''}</div>
    <div class="heatbar"><i style="width:${Math.min(100,done/e.sets.length*100)}%"></i></div>
    <div class="set-labels"><span>סט</span><span>פעם קודמת</span><span>ק״ג</span><span>חזרות</span><span></span></div>
    ${sets.map((s,j)=>{const g=ps[j],cur={w:num(s.w),r:num(s.r)},up=s.done&&better(cur,g),pr=s.done&&best&&better(cur,best);
     return `<div class="set${s.done?' done':''}${pr?' pr':''}" data-j="${j}"><span class="badge b${j%4+1}">${j+1}</span>
      <span class="ghost">${g?`${g.w??'—'} × ${g.r??'—'}`:'—'}${up?' <span class="up">▲</span>':''}</span>
      <input id="w-${e.key}-${j}" type="text" inputmode="decimal" aria-label="משקל סט ${j+1}" placeholder="${g&&g.w!=null?g.w:'ק״ג'}" value="${esc(s.w)}" data-f="w">
      <input id="r-${e.key}-${j}" type="text" inputmode="numeric" aria-label="חזרות סט ${j+1}" placeholder="${g&&g.r!=null?g.r:(e.sets[j]?repTxt(e.sets[j].r):'')}" value="${esc(s.r)}" data-f="r">
      <button class="check" type="button" data-act="done" aria-label="סט ${j+1} בוצע" aria-pressed="${s.done}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></button></div>`}).join('')}
    <button class="add-set" type="button" data-act="addset">+ ADD SET</button></section>`}).join('')}
  <div id="saveErr" class="warn" hidden></div>
  <button class="fire" type="button" data-act="finish">Forge it · Save</button>
  <button class="btn iron block" type="button" data-act="discard">Discard</button>
  <div id="discardAsk" class="warn" hidden><p style="margin:0 0 10px">למחוק את מה שהזנת באימון הזה?</p><div style="display:flex;gap:8px"><button class="btn heat" type="button" data-act="discard-yes">מחק</button><button class="btn iron" type="button" data-act="discard-no">השאר</button></div></div>`;
}

function vSummary(){
  const s=st.summary;
  return `<section class="forged"><div class="kicker">${fmtD(s.date)}</div><h1 class="mega">Session<br><span class="hot">forged</span></h1>
   <div class="big3"><div class="stat hot"><b>${Math.round(s.vol).toLocaleString('en')}</b><span>ק״ג הורמו</span></div><div class="stat"><b>${s.sets}</b><span>סטים</span></div><div class="stat${s.prs?' hot':''}"><b>${s.prs}</b><span>שיאים חדשים</span></div></div>
   <p class="sub">${s.prs?'שברת שיא. ככה בונים.':'נוכחת, עבדת, שמרת. בפעם הבאה המספרים האלה הם היעד.'}</p>
   <button class="fire" type="button" style="width:100%" data-act="to-gains">See your gains</button></section>`;
}

function vProgress(){
  const keys=Object.keys(ALL).filter(k=>st.sessions.some(s=>s.ex&&s.ex[k]&&s.ex[k].length));
  if(!keys.length)return `<div><div class="kicker">Gains</div><h1 class="mega">Nothing <span class="hot">yet</span></h1><p class="sub">אחרי האימון הראשון שתשמור יופיע כאן גרף של משקל העבודה בכל תרגיל.</p></div>`;
  if(!keys.includes(st.prog))st.prog=keys[0];
  const k=st.prog,e=ALL[k];
  const pts=st.sessions.filter(s=>s.ex&&s.ex[k]&&s.ex[k].length).map(s=>{const a=s.ex[k];const top=a.reduce((m,x)=>x.w!=null&&(!m||x.w>m.w||(x.w===m.w&&(x.r||0)>(m.r||0)))?x:m,null);return {date:s.date,top,sets:a}}).filter(p=>p.top);
  const pr=pts.reduce((m,p)=>!m||better(p.top,m.top)?p:m,null),first=pts[0],last=pts[pts.length-1],diff=last.top.w-first.top.w;
  return `
  <div><div class="kicker">Gains</div><h1 class="mega">Up <span class="out">and</span> <span class="hot">up</span></h1><p class="sub">משקל הסט הכבד ביותר בכל אימון.</p></div>
  <div class="chiprow" role="group" aria-label="בחירת תרגיל">${keys.map(x=>`<button type="button" data-act="prog" data-k="${x}" aria-pressed="${x===k}">${esc(ALL[x].g)} · ${esc(ALL[x].name.split(' ').slice(0,3).join(' '))}</button>`).join('')}</div>
  <section class="panel chart"><div class="kicker">${esc(e.g)}</div><h2>${esc(e.name)}</h2>${chart(pts)}</section>
  <div class="stats"><div class="stat hot"><b>${pr.top.w}</b><span>שיא (ק״ג) <span class="pr">PR</span></span></div><div class="stat"><b>${last.top.w}×${last.top.r??'—'}</b><span>סט כבד אחרון</span></div><div class="stat"><b>${diff>0?'+':''}${diff}</b><span>ק״ג מאז ${fmtD(first.date)}</span></div></div>
  <section class="panel"><div class="kicker">History</div><div class="hist">${pts.slice().reverse().map(p=>`<div><span>${fmtD(p.date)}${p===pr?' <span class="pr">PR</span>':''}</span><span>${p.sets.map(x=>`${x.w??'—'}×${x.r??'—'}`).join('  ·  ')}</span></div>`).join('')}</div></section>`;
}

function chart(pts){
  const W=600,H=240,L=46,R=18,T=24,B=34,ws=pts.map(p=>p.top.w);let lo=Math.min(...ws),hi=Math.max(...ws);
  const span=Math.max(hi-lo,4),step=span<=10?2:span<=30?5:10;lo=Math.floor((lo-step/2)/step)*step;hi=Math.ceil((hi+step/2)/step)*step;
  const x=i=>pts.length===1?(L+W-R)/2:L+(W-L-R)*i/(pts.length-1),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const ticks=[];for(let v=lo;v<=hi+1e-9;v+=step)ticks.push(v);
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.top.w).toFixed(1)}`).join('');
  const area=pts.length>1?`${line}L${x(pts.length-1).toFixed(1)},${H-B}L${x(0).toFixed(1)},${H-B}Z`:'',every=Math.ceil(pts.length/6);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="גרף משקל עבודה" dir="ltr"><defs><linearGradient id="cl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E3173E"/><stop offset=".5" stop-color="#FF6A1A"/><stop offset="1" stop-color="#FFC23D"/></linearGradient><linearGradient id="ca" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6A1A" stop-opacity=".35"/><stop offset="1" stop-color="#FF6A1A" stop-opacity="0"/></linearGradient></defs>
   ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#2C241F"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="13" fill="#A49A8F">${v}</text>`).join('')}
   ${area?`<path d="${area}" fill="url(#ca)"/>`:''}
   <path d="${line}" fill="none" stroke="url(#cl)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
   ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.top.w)}" r="${i===pts.length-1?7:4.5}" fill="${i===pts.length-1?'#FFC23D':'#0A0807'}" stroke="#FF6A1A" stroke-width="2.5"/>${i%every===0||i===pts.length-1?`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="13" fill="#A49A8F">${fmtD(p.date)}</text>`:''}`).join('')}</svg>`;
}

function vSettings(){
  const cid=SP.clientId(),redir=SP.redirect();
  return `
  <div><div class="kicker">Settings</div><h1 class="mega">Set<span class="hot">up</span></h1></div>
  <section class="panel stack">
    <div><div class="kicker">Spotify</div><h2>${SP.connected()?'מחובר לספוטיפיי ✓':'חיבור ספוטיפיי'}</h2></div>
    <ol class="steps"><li>כנס ל־developer.spotify.com/dashboard עם חשבון ה־Premium שלך ולחץ Create app.</li><li>ב־Redirect URI הדבק בדיוק את הכתובת הזו:</li></ol>
    <div class="copyrow"><code id="redir">${esc(redir)}</code><button class="btn iron" type="button" data-act="copy">Copy</button></div>
    <ol class="steps" start="3"><li>סמן Web API ושמור. העתק את ה־Client ID והדבק כאן:</li></ol>
    <input class="field" id="cid" placeholder="Client ID" value="${esc(cid)}" autocomplete="off" spellcheck="false">
    <ol class="steps" start="4"><li>כדי שחבר יוכל להתחבר, הוסף את המייל שלו ב־User Management באפליקציה שיצרת.</li></ol>
    ${SP.connected()?`<button class="btn iron block" type="button" data-act="sp-out">Disconnect</button>`:`<button class="btn spot block" type="button" data-act="sp-in">Connect Spotify</button>`}
    <div id="spErr" class="warn" ${st.msg?'':'hidden'}>${esc(st.msg)}</div>
  </section>
  <section class="panel stack">
    <div><div class="kicker">Data</div><h2>הנתונים שלך</h2><p class="sub">האימונים נשמרים בדפדפן במכשיר הזה. כדי להעביר אותם למכשיר אחר, ייצא קובץ וייבא אותו שם.</p></div>
    <label class="btn iron block" for="imp" style="cursor:pointer">Import file</label><input type="file" id="imp" accept="application/json,.json" hidden>
    <button class="btn iron block" type="button" data-act="export">Export file</button>
    <div id="dataMsg" class="sub"></div>
  </section>
  <button class="btn heat block" type="button" data-act="close-settings">Done</button>`;
}

function vPlaylists(){
  const note=`<svg width="56" height="56" viewBox="0 0 24 24" fill="currentColor" style="color:var(--ghost)"><path d="M9 3v12.3A3.5 3.5 0 1 0 11 18V7h8V3z"/></svg>`;
  if(!SP.connected())return `<section class="panel connect-card"><div style="flex:1;min-width:0"><div class="kicker">War playlist</div><h2>המוזיקה שלך, בתוך האימון</h2><p class="sub">חבר את ספוטיפיי פעם אחת ותשלוט בשירים מכאן.</p></div><button class="btn spot" type="button" data-act="open-settings">Connect</button></section>`;
  const pl=SP.playlists;
  return `<section><div class="kicker">War playlist</div><h2 style="margin-bottom:12px">מה מרים אותך היום?</h2>
   <div class="prow">${pl==null?'<p class="sub">טוען…</p>':pl.length?pl.map(p=>`<button class="pcard" type="button" data-act="play-pl" data-uri="${esc(p.uri)}"><span class="art">${p.img?`<img src="${esc(p.img)}" alt="">`:note}<span class="play"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span></span><b>${esc(p.name)}</b><span>${p.count!=null?p.count+' שירים':'פלייליסט'}</span></button>`).join(''):'<p class="sub">לא נמצאו פלייליסטים.</p>'}</div></section>`;
}

function renderPlayer(){
  const el=$('#player'),ic=`<span class="ph"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M9 3v12.3A3.5 3.5 0 1 0 11 18V7h8V3z"/></svg></span>`;
  if(!SP.connected()){el.innerHTML=`${ic}<div class="meta"><b>Spotify</b><span>לא מחובר</span></div><button class="connect" type="button" data-act="open-settings">CONNECT</button>`;return}
  const s=SP.state;
  if(!s||!s.item){el.innerHTML=`${ic}<div class="meta"><b>${s&&s.err?esc(s.err):'שום דבר לא מתנגן'}</b><span>${s&&s.err?'':'בחר פלייליסט במסך הבית'}</span></div><div class="ctl"><button class="pp" type="button" data-act="sp-play" aria-label="נגן"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button></div>`;return}
  const it=s.item,img=it.album&&it.album.images&&it.album.images[it.album.images.length-1];
  el.innerHTML=`${img?`<img src="${esc(img.url)}" alt="">`:ic}<div class="meta"><b dir="auto">${esc(it.name)}</b><span dir="auto">${esc((it.artists||[]).map(a=>a.name).join(', '))}</span></div>
   <div class="ctl"><button type="button" data-act="sp-prev" aria-label="שיר קודם"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
   <button class="pp" type="button" data-act="${s.is_playing?'sp-pause':'sp-play'}" aria-label="${s.is_playing?'השהה':'נגן'}">${s.is_playing?'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>':'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'}</button>
   <button type="button" data-act="sp-next" aria-label="שיר הבא"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button></div>`;
}

function render(){
  $('#app').innerHTML=st.settings?vSettings():st.tab==='today'?vToday():st.tab==='workout'?vWorkout():vProgress();
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current',!st.settings&&b.dataset.tab===st.tab?'page':'false'));
  $('#streakN').textContent=st.sessions.filter(s=>daysSince(s.date)<30).length;
  renderPlayer();
}

/* ================= sparks ================= */
const FX=(()=>{const c=$('#sparks'),x=c.getContext('2d'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let W,H,dpr,P=[];
  function size(){dpr=Math.min(devicePixelRatio||1,2);W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr}size();addEventListener('resize',size);
  function ember(){return {x:Math.random()*W,y:H+10*dpr,vx:(Math.random()-.5)*.3*dpr,vy:-(0.4+Math.random()*1.1)*dpr,r:(0.6+Math.random()*1.6)*dpr,life:1,decay:.002+Math.random()*.004,hue:20+Math.random()*30}}
  if(!reduce)for(let i=0;i<28;i++){const e=ember();e.y=Math.random()*H;P.push(e)}
  function burst(px,py,n=40){if(reduce)return;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(2+Math.random()*6)*dpr;P.push({x:px*dpr,y:py*dpr,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2*dpr,r:(1+Math.random()*2)*dpr,life:1,decay:.018+Math.random()*.02,hue:15+Math.random()*35,g:.12*dpr})}}
  function loop(){if(document.hidden){requestAnimationFrame(loop);return}x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';
    P=P.filter(p=>p.life>0);if(!reduce)while(P.filter(p=>!p.g).length<28)P.push(ember());
    for(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.g)p.vy+=p.g;else p.vx+=(Math.random()-.5)*.05*dpr;p.life-=p.decay;
      x.fillStyle=`hsla(${p.hue},100%,${55+p.life*20}%,${Math.max(0,p.life)*.9})`;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}
    requestAnimationFrame(loop)}
  if(!reduce)loop();return {burst}})();

/* ================= Spotify (Authorization Code with PKCE, no server) ================= */
const SP={
  scopes:'user-read-playback-state user-modify-playback-state user-read-currently-playing playlist-read-private playlist-read-collaborative',
  state:null,playlists:null,
  clientId:()=>LS.get('ng-sp-cid',''),
  redirect:()=>location.origin+location.pathname,
  tok:()=>LS.get('ng-sp-tok',null),
  connected(){return !!this.tok()},
  async login(){
    const cid=($('#cid')&&$('#cid').value.trim())||this.clientId();
    if(!cid){st.msg='הדבק קודם את ה־Client ID מהדשבורד של ספוטיפיי.';render();return}
    LS.set('ng-sp-cid',cid);
    const v=b64(crypto.getRandomValues(new Uint8Array(48)));LS.set('ng-sp-ver',v);
    const ch=b64(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v))));
    const q=new URLSearchParams({response_type:'code',client_id:cid,scope:this.scopes,code_challenge_method:'S256',code_challenge:ch,redirect_uri:this.redirect()});
    location.href='https://accounts.spotify.com/authorize?'+q;
  },
  async handleRedirect(){
    const p=new URLSearchParams(location.search);
    if(p.get('error')){st.msg='ספוטיפיי לא אישר את החיבור: '+p.get('error');st.settings=true;history.replaceState(null,'',this.redirect());return}
    const code=p.get('code');if(!code)return;
    history.replaceState(null,'',this.redirect());
    try{await this.token({grant_type:'authorization_code',code,redirect_uri:this.redirect(),client_id:this.clientId(),code_verifier:LS.get('ng-sp-ver','')});LS.del('ng-sp-ver');st.msg=''}
    catch(e){st.msg='החיבור נכשל. בדוק שה־Redirect URI בדשבורד זהה בדיוק לכתובת בהגדרות, ושהמייל שלך רשום ב־User Management.';st.settings=true}
  },
  async token(body){
    const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(body)});
    if(!r.ok)throw new Error('token '+r.status);
    const j=await r.json();const old=this.tok()||{};
    LS.set('ng-sp-tok',{access:j.access_token,refresh:j.refresh_token||old.refresh,exp:Date.now()+(j.expires_in-60)*1000});
  },
  async access(){const t=this.tok();if(!t)return null;if(Date.now()<t.exp)return t.access;
    try{await this.token({grant_type:'refresh_token',refresh_token:t.refresh,client_id:this.clientId()});return this.tok().access}catch(e){LS.del('ng-sp-tok');return null}},
  async api(path,opt={}){
    const a=await this.access();if(!a)throw {code:'auth'};
    const r=await fetch('https://api.spotify.com/v1'+path,{...opt,headers:{Authorization:'Bearer '+a,'Content-Type':'application/json',...(opt.headers||{})}});
    if(r.status===204||r.status===202)return null;
    let j=null;try{j=await r.json()}catch(e){}
    if(!r.ok)throw {code:r.status,reason:j&&j.error&&(j.error.reason||j.error.message)};
    return j;
  },
  async refresh(){
    if(!this.connected())return;
    try{const s=await this.api('/me/player?additional_types=track');this.state=s||{};}
    catch(e){this.state={err:e.code==='auth'?'החיבור לספוטיפיי פג':e.code===429?'יותר מדי בקשות, נסה עוד רגע':'אין חיבור לספוטיפיי'}}
    renderPlayer();
  },
  async loadPlaylists(){
    try{const j=await this.api('/me/playlists?limit=20');this.playlists=(j.items||[]).filter(Boolean).map(p=>({name:p.name,uri:p.uri,img:p.images&&p.images.length?p.images[0].url:null,count:(p.items||p.tracks||{}).total}))}
    catch(e){this.playlists=[]}
    if(st.tab==='today'&&!st.settings)render();
  },
  async cmd(fn){
    try{await fn()}catch(e){
      if(e.code===404||e.reason==='NO_ACTIVE_DEVICE'){if(await this.wake()){try{await fn()}catch(e2){}}else{this.state={err:'פתח את ספוטיפיי בטלפון ונגן שיר אחד, ואז נסה שוב'};renderPlayer();return}}
      else if(e.code===403){this.state={err:'ספוטיפיי סירב לפקודה (נדרש Premium)'};renderPlayer();return}
    }
    setTimeout(()=>this.refresh(),400);
  },
  async wake(){try{const d=await this.api('/me/player/devices');const dev=(d.devices||[]).find(x=>x.type==='Smartphone')||(d.devices||[])[0];if(!dev)return false;await this.api('/me/player',{method:'PUT',body:JSON.stringify({device_ids:[dev.id],play:false})});await new Promise(r=>setTimeout(r,600));return true}catch(e){return false}}
};
function b64(bytes){let s='';bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}

/* ================= timer ================= */
let tEnd=0,tTotal=0,tInt=null,actx=null;const ARC=182.2;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,.22,.44].forEach((o,i)=>{const os=actx.createOscillator(),g=actx.createGain();os.type='square';os.frequency.value=i===2?1320:880;g.gain.setValueAtTime(.0001,actx.currentTime+o);g.gain.exponentialRampToValueAtTime(.18,actx.currentTime+o+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+o+.18);os.connect(g).connect(actx.destination);os.start(actx.currentTime+o);os.stop(actx.currentTime+o+.2)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,300])}catch(e){}}
function startTimer(sec,label){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}tTotal=sec;tEnd=Date.now()+sec*1000;$('#tLbl').textContent=label;$('#tHead').textContent='REST';$('#timer').hidden=false;clearInterval(tInt);tick();tInt=setInterval(tick,250)}
function tick(){const left=Math.max(0,Math.round((tEnd-Date.now())/1000));$('#tNum').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');$('#tArc').setAttribute('stroke-dashoffset',String(ARC*(1-(tTotal?left/tTotal:0))));
  if(left<=0){clearInterval(tInt);beep();$('#tHead').textContent='GO TIME';$('#tLbl').textContent='המנוחה נגמרה. לסט הבא!';setTimeout(()=>{if(Date.now()>=tEnd)$('#timer').hidden=true},6000)}}
$('#tPlus').onclick=()=>{tEnd+=15000;tTotal+=15;tick()};$('#tMinus').onclick=()=>{tEnd-=15000;tick()};$('#tSkip').onclick=()=>{clearInterval(tInt);$('#timer').hidden=true};

/* ================= events ================= */
document.querySelector('nav.tabs').addEventListener('click',ev=>{const b=ev.target.closest('button[data-tab]');if(!b)return;st.settings=false;st.summary=null;st.tab=b.dataset.tab;render();scrollTo(0,0)});
$('#openSettings').onclick=()=>{st.settings=true;render();scrollTo(0,0)};
document.addEventListener('input',ev=>{const inp=ev.target.closest('input[data-f]');if(!inp)return;const e=ALL[inp.closest('[data-key]').dataset.key];draftSets(e)[+inp.closest('[data-j]').dataset.j][inp.dataset.f]=inp.value;persist()});
document.addEventListener('change',ev=>{if(ev.target.id!=='imp'||!ev.target.files[0])return;const f=ev.target.files[0];const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);const list=(j.sessions||[]).filter(s=>s&&s.date&&s.ex);const have=new Set(st.sessions.map(s=>s.savedAt));let add=0;list.forEach(s=>{if(!have.has(s.savedAt)){st.sessions.push({type:'session',...s});add++}});sortS();persist();render();$('#dataMsg').textContent=`יובאו ${add} אימונים.`}catch(e){$('#dataMsg').textContent='הקובץ לא נקרא. ודא שזה קובץ JSON שיוצא מהאפליקציה.'}};rd.readAsText(f)});
document.addEventListener('click',async ev=>{
  const go=ev.target.closest('[data-go]');if(go){st.settings=false;st.tab=go.dataset.go;render();scrollTo(0,0);return}
  const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  const map={
    quote(){st.q=(st.q+1)%QUOTES.length;LS.set('ng-q',st.q);render()},
    'open-settings'(){st.settings=true;render();scrollTo(0,0)},
    'close-settings'(){st.settings=false;render();scrollTo(0,0)},
    'to-gains'(){st.summary=null;st.tab='progress';render();scrollTo(0,0)},
    'sp-in'(){SP.login()},
    'sp-out'(){LS.del('ng-sp-tok');SP.state=null;SP.playlists=null;render()},
    async copy(){const t=SP.redirect();try{await navigator.clipboard.writeText(t);b.textContent='Copied'}catch(e){const r=document.createRange();r.selectNodeContents($('#redir'));getSelection().removeAllRanges();getSelection().addRange(r)}},
    export(){const blob=new Blob([JSON.stringify({app:'noy-gavrielov',version:1,sessions:st.sessions},null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='noy-training-'+today()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)},
    prog(){st.prog=b.dataset.k;render()},
    swap(){st.alt[b.dataset.g]=!st.alt[b.dataset.g];persist();render()},
    'play-pl'(){const r=b.getBoundingClientRect();FX.burst(r.left+r.width/2,r.top+r.height/2,24);SP.cmd(()=>SP.api('/me/player/play',{method:'PUT',body:JSON.stringify({context_uri:b.dataset.uri})}))},
    'sp-play'(){SP.cmd(()=>SP.api('/me/player/play',{method:'PUT'}))},
    'sp-pause'(){SP.cmd(()=>SP.api('/me/player/pause',{method:'PUT'}))},
    'sp-next'(){SP.cmd(()=>SP.api('/me/player/next',{method:'POST'}))},
    'sp-prev'(){SP.cmd(()=>SP.api('/me/player/previous',{method:'POST'}))},
    addset(){draftSets(ALL[b.closest('[data-key]').dataset.key]).push({w:'',r:'',done:false});persist();render()},
    done(){const e=ALL[b.closest('[data-key]').dataset.key],j=+b.closest('[data-j]').dataset.j,s=draftSets(e)[j];
      if(!s.done){const prev=lastFor(e.key),g=prev&&prev.ex[e.key][j],best=bestEver(e.key);if(s.w===''&&g&&g.w!=null)s.w=String(g.w);if(s.r===''&&g&&g.r!=null)s.r=String(g.r);s.done=true;
        const cur={w:num(s.w),r:num(s.r)},r=b.getBoundingClientRect();FX.burst(r.left+r.width/2,r.top+r.height/2,better(cur,best)?90:better(cur,g)?50:18);
        try{navigator.vibrate&&navigator.vibrate(better(cur,best)?[60,40,120]:30)}catch(_){}
        const pl=e.sets[j]||e.sets[e.sets.length-1];startTimer(pl.rest,e.name.split(' ').slice(0,3).join(' '))}else s.done=false;
      persist();const y=scrollY;render();scrollTo(0,y)},
    discard(){$('#discardAsk').hidden=false},
    'discard-no'(){$('#discardAsk').hidden=true},
    'discard-yes'(){st.draft=null;persist();st.tab='today';render();scrollTo(0,0)},
    finish(){const ex={};let vol=0,sets=0,prs=0;Object.entries(st.draft?st.draft.sets:{}).forEach(([k,arr])=>{const best=bestEver(k);const rows=arr.filter(s=>s.done||s.w!==''||s.r!=='').map(s=>({w:num(s.w),r:num(s.r)})).filter(s=>s.w!=null||s.r!=null);if(rows.length){ex[k]=rows;rows.forEach(x=>{sets++;vol+=(x.w||0)*(x.r||0)});if(best&&rows.some(x=>better(x,best)))prs++}});
      if(!Object.keys(ex).length){const er=$('#saveErr');er.textContent='עוד לא הזנת אף סט. מלא משקל וחזרות, או לחץ ✓ על סט שעשית.';er.hidden=false;return}
      const date=st.draft.date||today();st.sessions.push({type:'session',date,ex,savedAt:Date.now()});sortS();st.draft=null;
      if(!LS.set('ng-sessions',st.sessions)){const er=$('#saveErr');er.textContent='הדפדפן לא שומר נתונים (אולי חלון פרטי). ייצא קובץ מההגדרות כדי לא לאבד את האימון.';er.hidden=false}
      persist();clearInterval(tInt);$('#timer').hidden=true;st.summary={date,vol,sets,prs};render();scrollTo(0,0);FX.burst(innerWidth/2,innerHeight/3,140)}
  };
  if(map[a])await map[a]();
});

/* ================= boot ================= */
(async()=>{
  sortS();render();
  await SP.handleRedirect();render();
  if(SP.connected()){SP.refresh();SP.loadPlaylists();setInterval(()=>{if(!document.hidden)SP.refresh()},5000)}
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&SP.connected())SP.refresh()});
})();
</script>
